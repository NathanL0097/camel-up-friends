<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="/games/sky-landing.css" />
  <link rel="stylesheet" href="/games/sky-landing-enhanced.css" />

  <link rel="stylesheet" href="/games/liars-tavern.css" />
  <link rel="stylesheet" href="/games/quiz-arena.css" />

  <link rel="stylesheet" href="/games/witch-town.css?v=20260826-rules3" />

  <link rel="stylesheet" href="/games/colt-express.css?v=20260902-1" />
  <link rel="stylesheet" href="/games/mobile-responsive.css" />
  <style>
    #eldritchFiles .hand-area { min-width: 0; }
    #eldritchFiles #investigatorRail { position: absolute; top: 84px; left: 50%; right: auto; width: min(1200px, calc(100% - 36px)); transform: translateX(-50%); display: flex; gap: 6px; }
    #eldritchFiles .investigator { flex: 1; min-width: 0; grid-template-columns: 30px minmax(90px, 1fr) auto auto 36px; }
    #eldritchFiles .investigator span:nth-of-type(n+3) { display: none; }
    #eldritchFiles .ef-board { padding-top: 76px; }
    @media (max-width: 850px) {
      #eldritchFiles { overflow: auto; }
      #eldritchFiles #playerDesk { width: calc(100vw - 10px); overflow-x: auto; }
      #eldritchFiles #investigatorRail { width: 800px; left: 5px; transform: none; }
    }
  </style>
  <link rel="stylesheet" href="/game-ui-system.css?v=20260904-2" />
  <link rel="stylesheet" href="/product-quality.css?v=20260906-1" />
</head>
<body>
  <div class="sun"></div>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">🎲</span><span>好友桌游馆<small>在线开桌</small></span></a>
    <button id="installAppButton" class="ghost-button install-app-button hidden" type="button">安装到手机</button>
    <button id="adminButton" class="ghost-button admin-button hidden" type="button">管理员后台</button>
    <button id="rulesButton" class="ghost-button">玩法说明</button>
    <div id="soundControls" class="sound-controls"><button id="soundToggle" type="button" aria-pressed="false">音效：关</button><button id="soundSettings" type="button" aria-label="声音设置">调音</button></div>
  </header>

  <main>
    <section id="landing" class="landing">
      <div class="hero-copy">
        <div class="eyebrow">多款桌游 · 实时联机 · 免注册加入</div>
        <h1>今晚，开一桌。</h1>
        <p>穿过沙漠、登上列车，或在圆桌前藏好你的秘密。选一场冒险，把今晚留给朋友。</p>
        <div class="feature-row"><span>好友专属牌桌</span><span>分享链接即入座</span><span>手机与电脑同桌</span></div>
      </div>
      <div class="entry-card paper">
        <div id="gamePicker" class="game-picker">
          <button id="gamePickerToggle" class="game-picker-toggle" type="button" aria-expanded="false">
            <span id="selectedGameIcon" class="selected-game-icon">骆</span>
            <span><small>当前选择</small><b id="selectedGameTitle">沙漠驼队竞速</b></span>
            <em id="gamePickerHint">展开游戏库</em><i>⌄</i>
          </button>
          <div id="gameDrawer" class="game-drawer" aria-hidden="true">
            <header><div><b>选择今晚的游戏</b><small>选择后自动收起</small></div><button id="closeGameDrawer" type="button" aria-label="收起游戏库">×</button></header>
            <div id="gameCatalog" class="game-catalog"><button class="game-choice selected" data-game-id="camel-race"><span>骆</span><b>沙漠驼队竞速</b><small>2–8人 · 技术演示</small></button></div>
          </div>
        </div>
        <div id="activationPanel" class="activation-panel">
          <div><span>🔐 内部测试权限</span><small id="activationStatus">请输入激活码后开始使用</small></div>
          <div class="activation-row"><input id="activationCode" maxlength="19" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="one-time-code" /><button id="activateButton" type="button">激活 30 小时</button></div>
        </div>
        <label for="nameInput">你的昵称</label>
        <input id="nameInput" maxlength="16" placeholder="例如：沙漠赌神" autocomplete="nickname" />
        <label for="roomPasswordInput" class="room-password-label">创建房间密码 <small>可选，4–32位</small></label>
        <input id="roomPasswordInput" maxlength="32" type="password" placeholder="不设置则直接凭房间号加入" autocomplete="new-password" />
        <button id="createButton" class="primary-button">创建好友房 <span>→</span></button>
        <div class="divider"><span>或者</span></div>
        <input id="joinPasswordInput" maxlength="32" type="password" placeholder="房间密码（如房主设置）" autocomplete="current-password" />
        <div class="join-row"><input id="codeInput" maxlength="6" placeholder="输入 6 位房间码" /><button id="joinButton">加入</button></div>
        <p id="entryHint" class="hint"></p>
      </div>
    </section>

    <section id="lobby" class="lobby hidden">
      <div class="lobby-card paper">
        <div class="eyebrow"><span id="lobbyGameTitle">好友桌游</span> · 你的好友房</div>
        <h2 id="lobbyHeadline">好友入席，好戏将至</h2>
        <p>复制链接发给朋友，他们不需要注册账号。</p>
        <div class="share-box"><span id="shareUrl"></span><button id="copyButton">复制链接</button></div>
        <div class="room-code">房间码 <strong id="roomCode"></strong></div>
        <div id="lobbyPlayers" class="lobby-players"></div>
        <div id="gameLobbySettings"></div>
        <button id="startButton" class="primary-button">开始比赛</button>
        <p id="hostHint" class="hint">只有房主可以开始；建议 2–8 人。</p>
      </div>
    </section>

    <section id="game" class="game hidden"><div id="gameMount"></div></section>
  </main>

  <dialog id="rulesDialog">
    <button id="closeRules" class="dialog-close">×</button>
    <div id="rulesContent"></div>
  </dialog>
  <div id="toast" class="toast"></div>
  <dialog id="soundDialog" aria-labelledby="soundTitle"><button id="soundClose" class="dialog-close" aria-label="关闭声音设置">×</button><h2 id="soundTitle">牌桌的声音</h2><p>仅播放按钮、骰子、卡牌和事件音效，不提供语音播报。</p><label class="sound-option"><input id="soundMute" type="checkbox" checked>全局音效静音</label><label class="sound-option" for="soundVolume">音量<input id="soundVolume" type="range" min="0" max="100" value="40"></label><button id="soundPreview" type="button">试听揭示音效</button><p class="hint">初次使用默认静音。开启后记住设置；切到其他标签时停止播放。</p></dialog>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/platform-audio.js"></script>
  <script src="/game-art.js"></script>
  <script src="/game-moments.js"></script>
  <script src="/games/poker-gto-trainer.js"></script>
  <script src="/pwa.js"></script>
  <script src="/room-identities.js"></script>
  <script src="/app.js"></script>
</body>
</html>
